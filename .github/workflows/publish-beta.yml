name: Publish Manager Downloader Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version to publish"
        required: true
        default: "0.8.1"
        type: string
      version_code:
        description: "Android versionCode"
        required: true
        default: "81"
        type: string
      beta_number:
        description: "Beta number"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-manager-downloader-beta
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish beta APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_VERSION_CODE: ${{ inputs.version_code }}
      BETA_NUMBER: ${{ inputs.beta_number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested beta
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $RELEASE_VERSION"
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer"
            exit 1
          fi

          if [[ ! "$BETA_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::beta_number must be a positive integer"
            exit 1
          fi

          SOURCE_VERSION="$(
            python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=.*?\?:\s*"([^"]+)"', text, re.S)
          if not match:
              raise SystemExit("Unable to read default versionName")
          print(match.group(1))
          PY
          )"

          if [[ "$SOURCE_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Requested version $RELEASE_VERSION does not match source version $SOURCE_VERSION"
            exit 1
          fi

          TAG="v${RELEASE_VERSION}-beta.${BETA_NUMBER}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found on the GitHub runner"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate temporary beta signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/manager-downloader-beta-${GITHUB_RUN_ID}.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="managerdownloader-beta"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 30 \
            -dname "CN=Manager Downloader Beta, OU=Beta, O=Manager Downloader, C=CO"

          chmod 600 "$KEYSTORE"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build beta release with R8
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace clean :app:assembleRelease \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PVERSION_CODE="$RELEASE_VERSION_CODE"

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)

          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi

          APK="${apks[0]}"

          if [[ "$APK" == *-unsigned.apk ]]; then
            echo "::error::Release APK is unsigned"
            exit 1
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          echo "$BADGING"

          grep -Fq "versionName='$RELEASE_VERSION'" <<<"$BADGING" || {
            echo "::error::APK versionName mismatch"
            exit 1
          }

          grep -Fq "versionCode='$RELEASE_VERSION_CODE'" <<<"$BADGING" || {
            echo "::error::APK versionCode mismatch"
            exit 1
          }

          mkdir -p dist
          cp "$APK" dist/ManagerDownloader-beta.apk

          (
            cd dist
            sha256sum ManagerDownloader-beta.apk > ManagerDownloader-beta.apk.sha256
          )

      - name: Upload beta APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManagerDownloader-${{ inputs.version }}-beta-${{ inputs.beta_number }}
          path: |
            dist/ManagerDownloader-beta.apk
            dist/ManagerDownloader-beta.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub beta Release
        shell: bash
        run: |
          set -euo pipefail

          cat > dist/release-notes.md <<EOF
          # Manager Downloader ${RELEASE_VERSION} Beta ${BETA_NUMBER}

          Compilación beta generada desde main.

          ## Importante
          Esta APK usa una firma temporal generada únicamente para esta ejecución.
          Para instalar otra beta posterior probablemente será necesario desinstalar
          primero la beta anterior.

          ## Incluye
          - Seguridad HTTPS y bloqueo de cleartext HTTP.
          - Protección frente a destinos locales/privados.
          - WebView endurecido.
          - Mejoras de pausa/reanudación.
          - Mejoras de estabilidad HTTP/torrent.
          - Multirange para pistas de YouTube cuando el servidor lo permite.
          - Minificación R8 habilitada.
          - APK verificada con apksigner.

          Commit: ${GITHUB_SHA}
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Manager Downloader v${RELEASE_VERSION} Beta ${BETA_NUMBER}" \
            --notes-file dist/release-notes.md \
            --prerelease \
            dist/ManagerDownloader-beta.apk \
            dist/ManagerDownloader-beta.apk.sha256
