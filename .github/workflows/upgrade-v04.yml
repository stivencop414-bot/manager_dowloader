name: Upgrade Manager Downloader v0.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup v0.3 green version
        run: |
          if git ls-remote --exit-code --heads origin v0.3-green >/dev/null 2>&1; then
            echo "Backup branch v0.3-green already exists; keeping it unchanged."
          else
            git push origin HEAD:refs/heads/v0.3-green
          fi

      - name: Extract v0.4 source
        run: |
          rm -rf /tmp/manager-v04
          mkdir -p /tmp/manager-v04
          unzip -q manager_downloader_v04_upgrade.zip -d /tmp/manager-v04

      - name: Replace application source
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/manager-v04/ ./

      - name: Commit v0.4 upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Upgrade Manager Downloader to v0.4 storage media and security"
          git push origin main
