          * @stivencop414-bot
          /.github/ @stivencop414-bot
          /app/src/main/java/com/managerdownloader/app/download/ @stivencop414-bot
          /app/src/main/java/com/managerdownloader/app/security/ @stivencop414-bot
          OWNERS

      - name: Security and regression preflight
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/v081-security-preflight.log
          : > "$LOG"
          FAIL=0
          check() {
            local label="$1" file="$2" needle="$3"
            if grep -Fq "$needle" "$file"; then
              echo "PASS | $label" | tee -a "$LOG"
            else
              echo "FAIL | $label | $file | $needle" | tee -a "$LOG"
              FAIL=1
            fi
          }
          reject() {
            local label="$1" file="$2" needle="$3"
            if grep -Fq "$needle" "$file"; then
              echo "FAIL | $label | forbidden: $needle" | tee -a "$LOG"
              FAIL=1
            else
              echo "PASS | $label" | tee -a "$LOG"
            fi
          }

          check version app/build.gradle.kts '?: "0.8.1"'
          check tls-manifest app/src/main/AndroidManifest.xml 'android:usesCleartextTraffic="false"'
          check tls-config app/src/main/res/xml/network_security_config.xml 'cleartextTrafficPermitted="false"'
          if grep -R -n -E 'usesCleartextTraffic="true"|cleartextTrafficPermitted="true"' app/src/main >/tmp/v081-cleartext.txt 2>/dev/null; then
            echo "FAIL | cleartext global todavía habilitado" | tee -a "$LOG"
            cat /tmp/v081-cleartext.txt | tee -a "$LOG"
            FAIL=1
          else
            echo "PASS | cleartext global bloqueado" | tee -a "$LOG"
          fi
