          check secure-url-policy app/src/main/java/com/managerdownloader/app/security/SecurityUrlPolicy.kt 'publicDns'
          check dns-object app/src/main/java/com/managerdownloader/app/security/SecurityUrlPolicy.kt 'val publicDns: Dns = object : Dns'
          check dns-lookup-override app/src/main/java/com/managerdownloader/app/security/SecurityUrlPolicy.kt 'override fun lookup(hostname: String): List<InetAddress>'
          check webmessage-newline-literal app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt "val separator = payload.indexOf('\\n')"
          check download-public-dns app/src/main/java/com/managerdownloader/app/download/DownloadService.kt '.dns(SecurityUrlPolicy.publicDns)'
          check generic-download-https app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'SecurityUrlPolicy.requirePublicHttps(task.url)'
          check staging-download-https app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'SecurityUrlPolicy.requirePublicHttps(url)'
          check no-tls-downgrade app/src/main/java/com/managerdownloader/app/download/DownloadService.kt '.followSslRedirects(false)'
          check bounded-hls app/src/main/java/com/managerdownloader/app/hls/HlsManifestParser.kt 'MAX_HLS_MANIFEST_BYTES'
          check bounded-extractor app/src/main/java/com/managerdownloader/app/youtube/YouTubeSupport.kt 'MAX_EXTRACTOR_RESPONSE_BYTES'
          check progressive-https app/src/main/java/com/managerdownloader/app/youtube/YouTubeSupport.kt '!it.isVideoOnly && SecurityUrlPolicy.isSafePublicHttps(it.content)'
          reject extractor-http-filter app/src/main/java/com/managerdownloader/app/youtube/YouTubeSupport.kt 'it.content.startsWith("http")'
          check yt-track-https app/src/main/java/com/managerdownloader/app/download/YouTubeMultiRangeDownloader.kt 'SecurityUrlPolicy.requirePublicHttps(url)'
          check webmessage app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'WebViewCompat.addWebMessageListener'
          check origin-check app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'sameHttpsOrigin'
          check webmessage-string-only app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'message.type != WebMessageCompat.TYPE_STRING'
          check direct-ui-https app/src/main/java/com/managerdownloader/app/ui/DownloadsScreen.kt 'if (trimmed.startsWith("http://", true)) return null'
          check direct-ui-public-policy app/src/main/java/com/managerdownloader/app/ui/DownloadsScreen.kt 'SecurityUrlPolicy.isSafePublicHttps(it)'
          reject legacy-js-bridge app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt '@JavascriptInterface'
          check r8 app/build.gradle.kts 'isMinifyEnabled = true'
          check rhino-r8-origin app/proguard-rules.pro '-dontwarn org.mozilla.javascript.JavaToJSONConverters'
          check rhino-r8-engine app/proguard-rules.pro '-keep class org.mozilla.javascript.engine.** { *; }'
          check rhino-r8-javax-script app/proguard-rules.pro '-dontwarn javax.script.**'
          check rhino-r8-dynalink app/proguard-rules.pro '-dontwarn jdk.dynalink.**'
          check r8-java-beans-descriptor app/proguard-rules.pro '-dontwarn java.beans.BeanDescriptor'
          check r8-java-beans-info app/proguard-rules.pro '-dontwarn java.beans.BeanInfo'
          check r8-java-beans-introspection-exception app/proguard-rules.pro '-dontwarn java.beans.IntrospectionException'
          check r8-java-beans-introspector app/proguard-rules.pro '-dontwarn java.beans.Introspector'
          check r8-java-beans-property app/proguard-rules.pro '-dontwarn java.beans.PropertyDescriptor'
          if grep -Eq '^[[:space:]]*-ignorewarnings([[:space:]]|$)' app/proguard-rules.pro; then
            echo "FAIL | R8 global ignorewarnings prohibido" | tee -a "$LOG"
            FAIL=1
          else
            echo "PASS | sin ignorewarnings global" | tee -a "$LOG"
          fi
          check torrent-singleton app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt 'internal object TorrentSessionHolder'
          check youtube-multirange app/src/main/java/com/managerdownloader/app/download/YouTubeMultiRangeDownloader.kt 'downloadIfSupported'
          check foreground-type app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'FOREGROUND_SERVICE_TYPE_DATA_SYNC'
          check fgs-pendingintent app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'PendingIntent.getForegroundService'
          check stop-race app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'stopSelfResult(stopId)'
          check cooperative-permit app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'segmentPermits.tryAcquire(200L, TimeUnit.MILLISECONDS)'
          reject eager-torrent-resume app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'torrentEngine.resume(id)'
          reject filechannel-interrupt app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'futures.forEach { it.cancel(true) }'
          check range-probe app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'parsedRange.end >= 0L'
          check range-overreturn-cap app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'val accepted = minOf(read.toLong(), remaining).toInt()'
          check atomic-persistence app/src/main/java/com/managerdownloader/app/data/DownloadRepository.kt 'AtomicFile'
          check power-lock app/src/main/java/com/managerdownloader/app/download/SafePowerManager.kt 'PARTIAL_WAKE_LOCK'

          mkdir -p .github/workflows
          if find .github/workflows -maxdepth 1 -type f -name 'upgrade-v0*.yml' 2>/dev/null | grep -q .; then
            echo "FAIL | legacy workflows siguen presentes" | tee -a "$LOG"
            FAIL=1
          else
            echo "PASS | legacy workflows retirados" | tee -a "$LOG"
          fi
          if find .github/workflows -maxdepth 1 -type f -name 'security-v081*.yml' 2>/dev/null | grep -q .; then
            echo "FAIL | workflows bootstrap v0.8.1 siguen presentes" | tee -a "$LOG"
            FAIL=1
          else
            echo "PASS | workflows bootstrap v0.8.1 retirados" | tee -a "$LOG"
          fi
          if grep -R -E 'gh release (upload|create).*app-debug|cp .*app-debug.apk.*ManagerDownloader.apk' .github/workflows >/dev/null 2>&1; then
            echo "FAIL | un workflow todavía publica APK debug" | tee -a "$LOG"
            FAIL=1
          else
            echo "PASS | no se publica APK debug" | tee -a "$LOG"
          fi

          git diff --check 2>&1 | tee -a "$LOG" || FAIL=1
          git status --short | tee -a "$LOG"
          if [ "$FAIL" -ne 0 ]; then
            echo "Preflight falló. No se hará push de la rama candidata." | tee -a "$LOG"
            exit 1
          fi

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v081-r5-security-preflight
          path: /tmp/v081-security-preflight.log
          if-no-files-found: ignore

      - name: Save reviewable candidate diff
        shell: bash
        run: git diff --binary > /tmp/v081-security-candidate.diff

      - name: Upload candidate diff
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v081-r5-security-candidate-diff
          path: /tmp/v081-security-candidate.diff
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile Kotlin source gate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:compileDebugKotlin \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.8.1 2>&1 | tee /tmp/v081-kotlin-build.log

      - name: Compile debug as regression gate only
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.8.1 2>&1 | tee /tmp/v081-debug-build.log

      - name: Run R8 minifier gate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:minifyReleaseWithR8 \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.8.1 2>&1 | tee /tmp/v081-r8-build.log

      - name: Package release after R8 gate
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.8.1 2>&1 | tee /tmp/v081-release-build.log

      - name: Upload build logs only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v081-r5-build-logs
          path: |
            /tmp/v081-kotlin-build.log
            /tmp/v081-debug-build.log
            /tmp/v081-r8-build.log
            /tmp/v081-release-build.log
            app/build/outputs/mapping/release/missing_rules.txt
            app/build/outputs/mapping/release/configuration.txt
          if-no-files-found: ignore

      - name: Commit candidate branch after successful builds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && { echo "ERROR: no hay cambios para v0.8.1"; exit 1; }
          git commit -m "Manager Downloader v0.8.1 security, resume and throughput hardening"
          git push -u origin "$CANDIDATE_BRANCH"

      - name: Open review Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v081-pr-body.md <<'BODY'
          ## Manager Downloader v0.8.1

          Security + stability candidate generated from a SHA-256 verified, source-only bundle on a Git-blob-pinned v0.8.0 source base.

          Security: TLS-only traffic, origin-checked WebMessageListener, bounded HLS/NewPipe responses, public-DNS SSRF defense, scoped JitPack, R8, and retirement of legacy direct-main/debug-release workflows.

          Resume/throughput: cooperative HTTP pause without Future.cancel(true) on FileChannel writers, startId-aware service shutdown, process-wide libtorrent SessionManager, fixed Range probe, and resumable multi-range YouTube HD tracks.

          Release/R8: NewPipe/Rhino Android rules are applied without disabling minification or using a global warning bypass. The exact JVM-only java.beans references reported by the R4 release build are scoped out.

          This workflow does not publish APKs, force tags, or push directly to main. Review and merge this PR first.
          BODY

          if gh pr create \
            --base main \
            --head "$CANDIDATE_BRANCH" \
            --title "Manager Downloader v0.8.1 — security + stability" \
            --body-file /tmp/v081-pr-body.md; then
            echo "Pull Request creado correctamente."
          else
            echo "::warning::La rama candidata sí fue publicada, pero GitHub no permitió crear el PR automáticamente."
            echo "Abre manualmente un PR desde $CANDIDATE_BRANCH hacia main."
          fi

      - name: Final security note
        shell: bash
        run: |
          echo "v0.8.1 R5 candidato listo. No se modificó main automáticamente."
          echo "Activa Branch Protection/Ruleset para main y exige PR antes de merge."
          echo "No publiques una APK hasta configurar firma de producción."
