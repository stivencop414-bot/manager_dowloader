          replace_exact(browser, 'cookie = if (url.startsWith("http", true)) {', 'cookie = if (url.startsWith("https://", true)) {', expected=2)
          replace_exact(
              browser,
              '    if (!trimmed.startsWith("http://", true) && !trimmed.startsWith("https://", true)) return null\n',
              '    if (!trimmed.startsWith("https://", true)) return null\n    if (!SecurityUrlPolicy.isSafePublicHttps(trimmed)) return null\n',
          )
          old_scheme = (
              'private fun isDownloadableScheme(url: String): Boolean =\n'
              '    url.startsWith("http://", true) ||\n'
              '        url.startsWith("https://", true) ||\n'
              '        url.startsWith("magnet:", true)'
          )
          new_scheme = (
              'private fun isDownloadableScheme(url: String): Boolean =\n'
              '    (url.startsWith("https://", true) && SecurityUrlPolicy.isSafePublicHttps(url)) ||\n'
              '        url.startsWith("magnet:", true)'
          )
          replace_exact(browser, old_scheme, new_scheme)
          replace_exact(browser, 'if (!/^https?:/i.test(url)) return url;', 'if (!/^https:/i.test(url)) return url;')
          replace_exact(
              browser,
              "if (!/^https?:/i.test(absolute) && absolute.indexOf('blob:') !== 0 && absolute.indexOf('magnet:') !== 0) return;",
              "if (!/^https:/i.test(absolute) && absolute.indexOf('blob:') !== 0 && absolute.indexOf('magnet:') !== 0) return;",
          )
          replace_exact(browser, "bridge.onMediaFound(absolute, type || 'unknown');", "bridge.postMessage(String(type || 'unknown').slice(0, 24) + '\\n' + absolute);")
          replace_exact(browser, "if (!bridge || !bridge.onMediaFound) return;", "if (!bridge || !bridge.postMessage) return;")

          # ---------------- Direct-download UI: reject cleartext before enqueue ----------------
          downloads_screen = "app/src/main/java/com/managerdownloader/app/ui/DownloadsScreen.kt"
          replace_exact(
              downloads_screen,
              "import com.managerdownloader.app.download.DownloadService\n",
              "import com.managerdownloader.app.download.DownloadService\nimport com.managerdownloader.app.security.SecurityUrlPolicy\n",
          )
          replace_exact(
              downloads_screen,
              'private fun normalizeUrl(value: String): String? {\n    val trimmed = value.trim()\n    if (trimmed.startsWith("magnet:", true)) return trimmed\n    val candidate = if (trimmed.startsWith("http://", true) || trimmed.startsWith("https://", true)) {\n        trimmed\n    } else {\n        "https://$trimmed"\n    }\n    return candidate.takeIf {\n        runCatching {\n            val parsed = android.net.Uri.parse(it)\n            !parsed.host.isNullOrBlank() &&\n                (parsed.scheme.equals("http", true) || parsed.scheme.equals("https", true))\n        }.getOrDefault(false)\n    }\n}',
              'private fun normalizeUrl(value: String): String? {\n    val trimmed = value.trim()\n    if (trimmed.startsWith("magnet:", true)) return trimmed\n    if (trimmed.startsWith("http://", true)) return null\n    val candidate = if (trimmed.startsWith("https://", true)) trimmed else "https://$trimmed"\n    return candidate.takeIf { SecurityUrlPolicy.isSafePublicHttps(it) }\n}'
          )

          # ---------------- Changelog ----------------
          # R5 generated-source integrity checks. These catch the exact class of errors
