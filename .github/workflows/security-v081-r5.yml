          git rm -f --ignore-unmatch .github/workflows/security-v081*.yml || true
          git rm -f --ignore-unmatch manager_downloader_v0*_upgrade.zip || true
          git rm -f --ignore-unmatch "$BUNDLE" || true

      - name: Add CODEOWNERS review marker
