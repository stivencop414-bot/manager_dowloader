name: Upgrade Manager Downloader v0.5.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup current green version
        run: |
          if git ls-remote --exit-code --heads origin v0.4-green >/dev/null 2>&1; then
            echo "Backup branch v0.4-green already exists; keeping it unchanged."
          else
            git push origin HEAD:refs/heads/v0.4-green
          fi

      - name: Extract v0.5.2 source
        run: |
          rm -rf /tmp/manager-v052
          mkdir -p /tmp/manager-v052
          unzip -q manager_downloader_v052_upgrade.zip -d /tmp/manager-v052

      - name: Replace application source
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/manager-v052/ ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile v0.5.2 before touching main
        run: |
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.5.2

      - name: Commit v0.5.2 only after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Manager Downloader v0.5.2 Compose weight compile fix"
            git push origin main
          fi

      - name: Prepare direct-download APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ManagerDownloader.apk

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-apk
          git push origin latest-apk --force

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk ManagerDownloader.apk --clobber
          else
            gh release create latest-apk ManagerDownloader.apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última compilación de prueba. Versión 0.5.2." \
              --prerelease
          fi
