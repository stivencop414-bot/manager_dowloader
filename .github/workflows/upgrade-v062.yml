name: Upgrade Manager Downloader v0.6.2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup current v0.6.1
        run: |
          if git ls-remote --exit-code --heads origin pre-v0.6.2 >/dev/null 2>&1; then
            echo "Backup pre-v0.6.2 already exists; keeping it unchanged."
          else
            git push origin HEAD:refs/heads/pre-v0.6.2
          fi

      - name: Extract v0.6.2 source
        run: |
          rm -rf /tmp/manager-v062
          mkdir -p /tmp/manager-v062
          unzip -q manager_downloader_v062_upgrade.zip -d /tmp/manager-v062

      - name: Replace application source
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/manager-v062/ ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile v0.6.2 before touching main
        run: |
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.6.2

      - name: Commit v0.6.2 after successful build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Changes that will be committed:"
          git status --short

          if git diff --cached --quiet; then
            echo "ERROR: v0.6.2 compiled but produced no source changes."
            exit 1
          fi

          git commit -m "Manager Downloader v0.6.2 runtime stability and media filtering"
          git push origin main

      - name: Prepare direct-download APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ManagerDownloader.apk

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-apk HEAD
          git push origin latest-apk --force

          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk ManagerDownloader.apk --clobber
            gh release edit latest-apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última compilación de prueba. Versión 0.6.2."
          else
            gh release create latest-apk ManagerDownloader.apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última compilación de prueba. Versión 0.6.2." \
              --prerelease
          fi

      - name: Publish versioned v0.6.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v0.6.2 HEAD
          git push origin v0.6.2 --force

          if gh release view v0.6.2 >/dev/null 2>&1; then
            gh release upload v0.6.2 ManagerDownloader.apk --clobber
            gh release edit v0.6.2 \
              --title "Manager Downloader v0.6.2" \
              --notes-file CHANGELOG.md
          else
            gh release create v0.6.2 ManagerDownloader.apk \
              --title "Manager Downloader v0.6.2" \
              --notes-file CHANGELOG.md \
              --prerelease
          fi
