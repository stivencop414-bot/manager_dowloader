name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }}

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ManagerDownloader.apk

      - name: Create or update latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f debug-latest
          git push origin debug-latest --force

          if gh release view debug-latest >/dev/null 2>&1; then
            gh release upload debug-latest ManagerDownloader.apk --clobber
          else
            gh release create debug-latest ManagerDownloader.apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última versión de prueba compilada automáticamente desde main." \
              --prerelease
          fi
