name: Migrate to Native Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup current Replit version
        run: |
          git push origin HEAD:refs/heads/legacy-replit --force

      - name: Extract native Android project
        run: |
          mkdir -p /tmp/manager-native
          unzip -q manager_downloader_native.zip -d /tmp/manager-native

      - name: Replace repository contents
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            /tmp/manager-native/ ./

      - name: Commit native Android migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Migrate Manager Downloader to native Android"
          git push origin main
