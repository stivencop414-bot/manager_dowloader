name: Migrate to Native Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract native project
        run: |
          rm -rf /tmp/manager-native
          mkdir -p /tmp/manager-native
          unzip -q manager_downloader_native.zip -d /tmp/manager-native

      - name: Replace project files
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/manager-native/ ./

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git status

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Migrate Manager Downloader to native Android"
          git push origin main
