name: Upgrade Manager Downloader v0.7.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.7.3 base and create backup
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(grep -oE '\?: "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts | head -1 || true)
          echo "Current main version marker: ${CURRENT_VERSION:-unknown}"
          if ! grep -Fq '?: "0.7.3"' app/build.gradle.kts; then
            echo "WARNING: main no longer reports 0.7.3. Build remains protected because compile happens before commit."
          fi
          if git ls-remote --exit-code --heads origin pre-v0.7.5 >/dev/null 2>&1; then
            echo "Backup pre-v0.7.5 already exists; leaving it unchanged."
          else
            git push origin HEAD:refs/heads/pre-v0.7.5
          fi

      - name: Extract v0.7.5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-v075
          mkdir -p /tmp/manager-v075
          unzip -q manager_downloader_v075_upgrade.zip -d /tmp/manager-v075
          test -f /tmp/manager-v075/app/build.gradle.kts
          test -f /tmp/manager-v075/app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt
          test -f /tmp/manager-v075/app/src/main/java/com/managerdownloader/app/download/DownloadService.kt
          test -f /tmp/manager-v075/app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt
          test -f /tmp/manager-v075/app/src/main/java/com/managerdownloader/app/youtube/YouTubeSupport.kt
          test -f /tmp/manager-v075/app/src/main/java/com/managerdownloader/app/browser/MediaSnifferFilter.kt

      - name: Replace application source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/manager-v075/ ./

      - name: Preflight v0.7.5 source
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/v075-preflight.log
          : > "$LOG"
          FAIL=0

          check() {
            local label="$1" file="$2" needle="$3"
            if grep -Fq "$needle" "$file"; then
              echo "PASS | $label | $file | $needle" | tee -a "$LOG"
            else
              echo "FAIL | $label | $file | $needle" | tee -a "$LOG"
              FAIL=1
            fi
          }

          check version app/build.gradle.kts '?: "0.7.5"'
          check torrent-stop app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt 'if (control.stopped.get()) return'
          check youtube-transparent-gzip app/src/main/java/com/managerdownloader/app/youtube/YouTubeSupport.kt '!name.equals("Accept-Encoding", ignoreCase = true)'
          check sniffer-filter app/src/main/java/com/managerdownloader/app/browser/MediaSnifferFilter.kt 'canonicalMediaUrl'
          check sniffer-size-filter app/src/main/java/com/managerdownloader/app/browser/MediaSnifferFilter.kt 'MIN_USEFUL_MEDIA_BYTES'
          check batch-canonical-dedupe app/src/main/java/com/managerdownloader/app/ui/ManagerDownloaderApp.kt 'MediaSnifferFilter.canonicalMediaUrl'
          check parallel-cap app/src/main/java/com/managerdownloader/app/data/TransferSettings.kt 'maxParallelDownloads.coerceIn(2, 4)'
          check network-segment-cap app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'val networkCap = if (isWifiConnected()) 8 else 4'

          # Critical v0.7.3 protections must remain present.
          check sparse-part app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'archivo único reanudable'
          check range-validation app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'Content-Range no coincide'
          check async-atomic-persistence app/src/main/java/com/managerdownloader/app/data/DownloadRepository.kt 'AtomicFile'
          check power-lock app/src/main/java/com/managerdownloader/app/download/SafePowerManager.kt 'PARTIAL_WAKE_LOCK'
          check torrent-flush app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt 'flushCache()'
          check browser-safe-mode app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'browserSafeMode'
          check yt-refresh app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'refreshExpiredExtractedStream'
          check provider-scope app/src/main/res/xml/file_paths.xml 'internal_downloads'
          check tls-default app/src/main/res/xml/network_security_config.xml 'cleartextTrafficPermitted="false"'

          if [ "$FAIL" -ne 0 ]; then
            echo "Preflight failed. See v075-preflight-log artifact." | tee -a "$LOG"
            exit 1
          fi

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v075-preflight-log
          path: /tmp/v075-preflight.log
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile v0.7.5 before touching main
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.7.5 2>&1 | tee /tmp/v075-build.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v075-build-log
          path: /tmp/v075-build.log
          if-no-files-found: ignore

      - name: Commit v0.7.5 after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          echo "Changes that will be committed:"
          git status --short
          if git diff --cached --quiet; then
            echo "ERROR: v0.7.5 compiled but produced no source changes."
            exit 1
          fi
          git commit -m "Manager Downloader v0.7.5 stabilization and audit edge-case fixes"
          git push origin main

      - name: Prepare direct-download APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ManagerDownloader.apk

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f latest-apk HEAD
          git push origin latest-apk --force
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk ManagerDownloader.apk --clobber
            gh release edit latest-apk --title "Manager Downloader - Última APK" --notes "Última compilación de prueba. Versión 0.7.5."
          else
            gh release create latest-apk ManagerDownloader.apk --title "Manager Downloader - Última APK" --notes "Última compilación de prueba. Versión 0.7.5." --prerelease
          fi

      - name: Publish versioned v0.7.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f v0.7.5 HEAD
          git push origin v0.7.5 --force
          if gh release view v0.7.5 >/dev/null 2>&1; then
            gh release upload v0.7.5 ManagerDownloader.apk --clobber
            gh release edit v0.7.5 --title "Manager Downloader v0.7.5" --notes-file CHANGELOG.md
          else
            gh release create v0.7.5 ManagerDownloader.apk --title "Manager Downloader v0.7.5" --notes-file CHANGELOG.md --prerelease
          fi
