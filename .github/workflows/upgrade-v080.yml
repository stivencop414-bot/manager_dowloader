name: Upgrade Manager Downloader v0.8.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-downloader-v080-upgrade
  cancel-in-progress: false

jobs:
  upgrade-build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify audited v0.7.5 base and create backup
        shell: bash
        run: |
          set -euo pipefail

          test -f manager_downloader_v080_upgrade.zip || {
            echo "ERROR: falta manager_downloader_v080_upgrade.zip en la raíz del repositorio"
            exit 1
          }

          grep -Fq '?: "0.7.5"' app/build.gradle.kts || {
            echo "ERROR: este paquete requiere la base v0.7.5 auditada. No se tocará main."
            exit 1
          }

          grep -Fq 'archivo único reanudable' app/src/main/java/com/managerdownloader/app/download/DownloadService.kt || {
            echo "ERROR: no se encontró la protección de archivo .part de v0.7.5"
            exit 1
          }

          grep -Fq 'refreshExpiredExtractedStream' app/src/main/java/com/managerdownloader/app/download/DownloadService.kt || {
            echo "ERROR: no se encontró el refresco de URLs temporales de v0.7.5"
            exit 1
          }

          if git ls-remote --exit-code --heads origin pre-v0.8.0 >/dev/null 2>&1; then
            echo "La rama pre-v0.8.0 ya existe; no se moverá ni sobrescribirá."
          else
            git push origin HEAD:refs/heads/pre-v0.8.0
          fi

      - name: Extract upgrade bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/manager-v080-upgrade
          mkdir -p /tmp/manager-v080-upgrade
          unzip -q manager_downloader_v080_upgrade.zip -d /tmp/manager-v080-upgrade
          test -f /tmp/manager-v080-upgrade/apply_v080.py
          test -f /tmp/manager-v080-upgrade/payload/app/src/main/java/com/managerdownloader/app/media/NativeMediaMuxerEngine.kt
          test -f /tmp/manager-v080-upgrade/payload/app/src/main/java/com/managerdownloader/app/hls/HlsManifestParser.kt
          test -f /tmp/manager-v080-upgrade/payload/app/src/main/java/com/managerdownloader/app/youtube/YouTubePlaylistSupport.kt
          test -f /tmp/manager-v080-upgrade/payload/app/src/main/java/com/managerdownloader/app/clipboard/ClipboardMonitor.kt

      - name: Apply v0.8.0 overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/manager-v080-upgrade/apply_v080.py --repo "$GITHUB_WORKSPACE"

      - name: Preflight v0.8.0
        shell: bash
        run: |
          set -uo pipefail
          LOG=/tmp/v080-preflight.log
          : > "$LOG"
          FAIL=0

          check() {
            local label="$1" file="$2" needle="$3"
            if grep -Fq "$needle" "$file"; then
              echo "PASS | $label | $file | $needle" | tee -a "$LOG"
            else
              echo "FAIL | $label | $file | $needle" | tee -a "$LOG"
              FAIL=1
            fi
          }

          check version app/build.gradle.kts '?: "0.8.0"'

          # 8 audited stability patches
          check cleartext-manifest app/src/main/AndroidManifest.xml 'android:usesCleartextTraffic="true"'
          check cleartext-network app/src/main/res/xml/network_security_config.xml 'cleartextTrafficPermitted="true"'
          check robust-url app/src/main/java/com/managerdownloader/app/ui/DownloadsScreen.kt 'val parsed = android.net.Uri.parse(it)'
          check torrent-private-import app/src/main/java/com/managerdownloader/app/MainActivity.kt 'importTorrentUri(uri)?.let'
          check zero-byte-cleanup app/src/main/java/com/managerdownloader/app/data/StorageRepository.kt 'runCatching { source.delete() }'
          check hosts-whitespace app/src/main/java/com/managerdownloader/app/browser/ContentBlocker.kt 'hostsParts = line.split'
          check zero-space app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'usableSpace in 0 until'
          check generic-http-view app/src/main/java/com/managerdownloader/app/MainActivity.kt 'uri.scheme.equals("http", true)'
          check torrent-validity app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt 'torrentHandle.isValid'

          # Video / playlist / HLS / clipboard
          check mux-kind app/src/main/java/com/managerdownloader/app/data/DownloadModels.kt 'YOUTUBE_MUXED'
          check jit-kind app/src/main/java/com/managerdownloader/app/data/DownloadModels.kt 'YOUTUBE_JIT'
          check native-mux app/src/main/java/com/managerdownloader/app/media/NativeMediaMuxerEngine.kt 'MediaMuxer'
          check hd-refresh app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'refreshMuxedTask'
          check hd-stage app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'yt-video.part'
          check playlist-pagination app/src/main/java/com/managerdownloader/app/youtube/YouTubePlaylistSupport.kt 'PlaylistInfo.getMoreItems'
          check playlist-jit app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'sourceProfile = "best_progressive"'
          check hls-parser app/src/main/java/com/managerdownloader/app/hls/HlsManifestParser.kt '#EXT-X-STREAM-INF'
          check hls-fetch-hook app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt "stream_fetch"
          check reactive-rescan app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt '__rescanActivePlayerQualities'
          check clipboard-foreground app/src/main/java/com/managerdownloader/app/clipboard/ClipboardMonitor.kt 'Foreground-only clipboard helper'

          # Critical v0.7.5 protections must remain.
          check sparse-part app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'archivo único reanudable'
          check range-validation app/src/main/java/com/managerdownloader/app/download/DownloadService.kt 'Content-Range no coincide'
          check atomic-persistence app/src/main/java/com/managerdownloader/app/data/DownloadRepository.kt 'AtomicFile'
          check power-lock app/src/main/java/com/managerdownloader/app/download/SafePowerManager.kt 'PARTIAL_WAKE_LOCK'
          check torrent-flush app/src/main/java/com/managerdownloader/app/download/TorrentEngine.kt 'flushCache()'
          check browser-safe-mode app/src/main/java/com/managerdownloader/app/ui/BrowserScreen.kt 'browserSafeMode'
          check provider-scope app/src/main/res/xml/file_paths.xml 'internal_downloads'

          git diff --check 2>&1 | tee -a "$LOG" || FAIL=1
          git status --short | tee -a "$LOG"

          if [ "$FAIL" -ne 0 ]; then
            echo "Preflight v0.8.0 falló. No se hará commit ni push." | tee -a "$LOG"
            exit 1
          fi

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v080-preflight-log
          path: /tmp/v080-preflight.log
          if-no-files-found: ignore

      - name: Save candidate diff
        shell: bash
        run: git diff --binary > /tmp/v080-candidate.diff

      - name: Upload candidate diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v080-candidate-diff
          path: /tmp/v080-candidate.diff
          if-no-files-found: ignore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Compile v0.8.0 before touching remote main
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.8.0 2>&1 | tee /tmp/v080-build.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v080-build-log
          path: /tmp/v080-build.log
          if-no-files-found: ignore

      - name: Commit v0.8.0 only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          echo "Cambios v0.8.0 que se publicarán:"
          git status --short

          if git diff --cached --quiet; then
            echo "ERROR: la compilación pasó pero no hay cambios para confirmar."
            exit 1
          fi

          git commit -m "Manager Downloader v0.8.0 audit, HD muxing and media upgrade"
          git push origin main

      - name: Prepare direct-download APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk ManagerDownloader.apk

      - name: Publish latest test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f latest-apk HEAD
          git push origin latest-apk --force
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk ManagerDownloader.apk --clobber
            gh release edit latest-apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última compilación de prueba. Versión 0.8.0. Incluye auditoría v0.7.5, YouTube HD con mux nativo, playlists JIT, detección HLS reactiva y portapapeles en primer plano."
          else
            gh release create latest-apk ManagerDownloader.apk \
              --title "Manager Downloader - Última APK" \
              --notes "Última compilación de prueba. Versión 0.8.0. Incluye auditoría v0.7.5, YouTube HD con mux nativo, playlists JIT, detección HLS reactiva y portapapeles en primer plano." \
              --prerelease
          fi

      - name: Publish versioned v0.8.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f v0.8.0 HEAD
          git push origin v0.8.0 --force
          if gh release view v0.8.0 >/dev/null 2>&1; then
            gh release upload v0.8.0 ManagerDownloader.apk --clobber
            gh release edit v0.8.0 --title "Manager Downloader v0.8.0" --notes-file CHANGELOG.md
          else
            gh release create v0.8.0 ManagerDownloader.apk \
              --title "Manager Downloader v0.8.0" \
              --notes-file CHANGELOG.md \
              --prerelease
          fi
