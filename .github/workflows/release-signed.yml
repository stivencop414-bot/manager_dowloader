name: Publish Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Validate signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KSP" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KSA" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KAP" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manager-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/manager-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=0.4.${{ github.run_number }}

      - name: Verify APK signature
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk ManagerDownloader.apk

      - name: Publish signed direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-signed
          git push origin latest-signed --force

          if gh release view latest-signed >/dev/null 2>&1; then
            gh release upload latest-signed ManagerDownloader.apk --clobber
          else
            gh release create latest-signed ManagerDownloader.apk \
              --title "Manager Downloader - Signed" \
              --notes "APK release firmado con la clave permanente del proyecto." \
              --prerelease
          fi
